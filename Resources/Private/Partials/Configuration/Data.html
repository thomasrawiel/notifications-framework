<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:nf="http://typo3.org/ns/TRAW/NotificationsFramework/ViewHelpers"
      data-namespace-typo3-fluid="true">
<table class="table table-striped table-hover table-fit">
    <tr>
        <th>
            <core:icon identifier="actions-database"/>
            UID
        </th>
        <td>{configuration.uid}</td>
    </tr>
    <f:if condition="{showPidColumn}">
        <tr>
            <th>
                <core:icon identifier="actions-database"/>
                PID
            </th>
            <td>{configuration.pid}</td>
        </tr>

    </f:if>
    <tr>
        <th></th>
        <td>
            <f:format.date date="{configuration.crdate}" pattern="yyyy-MM-dd HH:mm:ss"/>
        </td>
    </tr>
    <f:if condition="{configuration.record}">
        <f:then>
            <tr>
                <th>
                    <f:translate
                        key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.record"/>
                </th>
                <td>
                    <div>{configuration.record.row.title} <code>[{configuration.record.uid}]</code></div>
                    <div><i>{configuration.table}</i></div>
                    <f:debug inline="true" title="Data">{configuration.record}</f:debug>
                </td>
            </tr>
        </f:then>
        <f:else>
            <tr>
                <th>
                    <f:translate
                        key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.label"/>
                </th>
                <td>
                    {configuration.label}
                </td>
            </tr>
            <tr>
                <th>
                    <f:translate
                        key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.message"/>
                </th>
                <td>
                    {configuration.message}
                </td>
            </tr>
            <tr>
                <th>
                    <f:translate
                        key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.url"/>
                </th>
                <td>
                    {configuration.url}
                </td>
            </tr>
            <tr>
                <th>
                    <f:translate
                        key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.image"/>
                </th>
                <td>
                    <f:if condition="{configuration.image}">
                       <img src="{configuration.image}" width="100" />
                    </f:if>
                </td>
            </tr>
        </f:else>
    </f:if>
    <tr>
        <th>
            <f:translate
                key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.automatic"/>
        </th>
        <td>
            <f:if condition="{configuration.automatic}">
                <core:icon identifier="actions-check" size="small"/>
            </f:if>
        </td>
    </tr>
</table>
<table class="table mt-4">
    <tr>
        <th>
            <f:translate
                key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.push"/>
        </th>
        <th>
            <f:translate
                key="LLL:EXT:notifications_framework/Resources/Private/Language/locallang_tca.xlf:configuration.done"/>
        </th>
    </tr>
    <tr>
        <td>
            <core:icon identifier="{f:if(condition: configuration.push, then:'actions-check-square', else:'actions-square')}" size="small"/>
        </td>


        <td>
            <core:icon identifier="{f:if(condition: configuration.done, then:'actions-check-square', else:'actions-square')}" size="small"/>
        </td>
    </tr>
</table>
</html>
